name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild -scheme DeviceTester -sdk iphoneos -configuration Release build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceTester
          path: build
